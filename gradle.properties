org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Compose Preview Screenshot Testing。プラグインの適用より前に効いている
# 必要があるため、モジュール側の experimentalProperties だけでは足りない。
android.experimental.enableScreenshotTest=true

# 上の 1 行が実験オプションであることを毎ビルド警告してくるので黙らせる。
# 意図して使っているのは enableScreenshotTest だけ。ほかの実験オプションを
# 足すときは、この抑止があるぶん警告が出ないことを承知の上で足すこと。
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
