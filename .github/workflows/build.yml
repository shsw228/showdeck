name: build

# ドキュメントだけの変更では回さない。README とスクリーンショットは
# ビルドの結果に一切影響しないので、10 分待つ理由がない。
# paths-ignore は「変更が全部ここに入るとき」だけ省く判定なので、
# コードと README を同じコミットで触ったときはちゃんと走る。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# 同じブランチに続けて push したら古いほうを止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # SDK は runner のイメージに入っているものを使う。setup-android は
      # cmdline-tools を毎回入れ直したうえ emulator まで入れるので、
      # 実機しか使わないこの CI には要らない（platform 37 は既に在る）。
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # release はプラットフォーム署名鍵（keys/platform.p12）を要るので回さない。
      # 鍵はリポジトリに入れない（AOSP の公開テスト鍵だが、置く必要がない）。
      # debug ビルドは鍵が無ければ Gradle 既定の debug 鍵に落ちるので通る。
      - name: Test, lint, build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: showdeck-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
